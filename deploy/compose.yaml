# What each app service runs, and how it is told so.
#
# Each environment's image tag lives in its own file, env/<env>/image.env
# (PROD_IMAGE_TAG=<sha>, PREPROD_IMAGE_TAG=<sha>), which deploy/rollout.sh
# writes when it deploys that environment. Compose only interpolates from .env,
# so rollout.sh rebuilds .env from those files every time: .env is derived and
# never edited by hand. That way a deploy of one environment cannot overwrite
# the other's tag, and any compose command run by hand sees both — a bare
# `docker compose up -d` changes nothing rather than rolling both to latest.
#
# A deploy only ever names its own service (`up -d app-preprod`), so one
# environment's deploy never recreates the other's container.
x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The domain Caddy serves and certifies. It belongs to the deployment, not
    # the repo, so it comes from an untracked /opt/dropin/site.env the operator
    # writes once (issue #202).
    #
    # env_file rather than compose interpolation, and site.env rather than .env,
    # for two separate reasons. The Caddyfile's {$SITE_DOMAIN} is resolved by
    # Caddy itself, so the value has to reach the *process* environment —
    # interpolation would only substitute it into this file. And the deploy
    # workflow writes /opt/dropin/.env wholesale on every deploy, so anything
    # put there survives exactly until the next merge.
    env_file: ./site.env
    # Left to itself Caddy does refuse an empty site address, but as
    # "unrecognized global option: reverse_proxy" — because ` { ... }` parses as
    # a global options block — which names the wrong thing entirely. Say what is
    # actually wrong first, then hand over to the image's own command.
    command:
      - sh
      - -c
      - |
        if [ -z "$$SITE_DOMAIN" ]; then
          echo "SITE_DOMAIN is empty or unset: set it in /opt/dropin/site.env (see docs/deployment.md)" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # prod. Still called `app`, its name from before preprod existed: renaming it
  # would replace the container.
  app:
    <<: *app
    image: ghcr.io/jakec-github/ilford-drop-in:${PROD_IMAGE_TAG:-latest}
    volumes:
      # The environment's directory, not its files individually. A single-file
      # bind mount pins the inode it resolved at container start, so replacing
      # the file on the host leaves the container serving the previous revision —
      # which is how a config fix took four rounds to land (issue #100). A
      # directory mount is resolved by path on every start, so a recreate always
      # picks up whatever is in the directory now.
      #
      # /app is the image's working directory, and the server reads its files
      # from env/<env>/ beneath it (config.EnvPath). Populate it with
      # scripts/deploy-config.sh <env>.
      - ./env/prod:/app/env/prod:ro

  app-preprod:
    <<: *app
    image: ghcr.io/jakec-github/ilford-drop-in:${PREPROD_IMAGE_TAG:-latest}
    command: ["-env", "preprod"]
    volumes:
      - ./env/preprod:/app/env/preprod:ro

volumes:
  caddy_data:
  caddy_config:
