name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The same server scripts/test-db.sh runs locally: port 5432,
    # postgres/postgres, and the database pkg/db/dbtest connects to when
    # TEST_DATABASE_URL is unset. Each test then mints its own throwaway
    # database on it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ilford_dropin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # check.sh builds pyallocator/.venv on top of this to run the solver
      # tests. requires-python is a floor, so this tracks the newest Python the
      # allocator claims to support rather than pinning a second version here.
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyallocator/pyproject.toml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      # CI is set by the runner, so check.sh leaves the database to the service
      # container above rather than reaching for Docker and OrbStack.
      - name: Run checks
        run: scripts/check.sh

  # Builds the server image and runs the solver inside it: the image carries its
  # own Python and venv, and nothing in the check job above exercises them. The
  # deploy workflow runs the same smoke test before it pushes.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ilford-drop-in:ci
          cache-from: type=gha

      - name: Smoke test the image
        run: scripts/image-smoke.sh ilford-drop-in:ci
