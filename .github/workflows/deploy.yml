name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and smoke tested before anything is pushed, so an image that
      # cannot run the solver never reaches ghcr (#227). The push below is the
      # same build again, served from the cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ilford-drop-in:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/image-smoke.sh ilford-drop-in:smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha

  # One leg per environment, run one at a time so two rollouts never prune
  # images under each other. Each leg names only its own service, so deploying
  # one never recreates the other (rollout.sh fails the leg if it did).
  #
  # Preprod first. Prod still deploys on every push until the manual promote
  # lands (#245), and fail-fast is off so a broken preprod does not hold it back
  # meanwhile.
  deploy:
    needs: build
    # Gated until go-live (ADR 0002). Set the DEPLOY_ENABLED repository
    # variable to "true" to enable. Rollback is re-running this workflow on a
    # previous commit — or just its prod leg.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        env: [preprod, prod]
    name: deploy (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync deploy files to the droplet
        run: scp deploy/compose.yaml deploy/Caddyfile deploy/rollout.sh "root@${{ secrets.DEPLOY_HOST }}:/opt/dropin/"

      # rollout.sh records the tag, recreates this environment's container,
      # waits for /health on its own host and prunes unused images — or, while
      # the environment is switched off, skips with a notice.
      #
      # The logout matters: the token dies with this job, and docker refuses
      # even a public pull ("denied") while it holds a dead login for the
      # registry, which would break `scripts/preprod.sh up` and every rollback.
      - name: Deploy
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            "trap 'docker logout ghcr.io >/dev/null' EXIT \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && GITHUB_ACTIONS=true bash /opt/dropin/rollout.sh '${{ matrix.env }}' '${{ github.sha }}'"
