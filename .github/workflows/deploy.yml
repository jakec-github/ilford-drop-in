name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and smoke tested before anything is pushed, so an image that
      # cannot run the solver never reaches ghcr (#227). The push below is the
      # same build again, served from the cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ilford-drop-in:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/image-smoke.sh ilford-drop-in:smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha

  # A merge deploys preprod and nothing else. Prod is released by hand, from
  # an image this job has already run on preprod: the "Deploy to production"
  # workflow (promote.yml, #245).
  deploy:
    needs: build
    name: deploy (preprod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync deploy files to the droplet
        run: scp deploy/compose.yaml deploy/Caddyfile deploy/rollout.sh "root@${{ secrets.DEPLOY_HOST }}:/opt/dropin/"

      # The deploy files are main's for prod too: the production workflow
      # promotes an image and leaves these as this job put them.
      #
      # rollout.sh records the tag, recreates the app-preprod container and no
      # other, waits for preprod's /health and prunes unused images — or, while
      # preprod is switched off (scripts/preprod.sh down), skips with a notice.
      #
      # The logout matters: the token dies with this job, and docker refuses
      # even a public pull ("denied") while it holds a dead login for the
      # registry, which would break `scripts/preprod.sh up` and every
      # production deploy.
      - name: Deploy
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            "trap 'docker logout ghcr.io >/dev/null' EXIT \
            && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && GITHUB_ACTIONS=true bash /opt/dropin/rollout.sh preprod '${{ github.sha }}'"
